<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beslissingen</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar">
    <h2>Resort Management</h2>
    <a href="#">Overzicht</a>
    <a href="#" class="active">Beslissingen</a>
    <a href="#">Ranglijst</a>
    <a href="#">Host</a>
    <a href="#">Feedback</a>
</div>

<div class="content top-bar">
    <h1>Beslissingen</h1>
    <p>Maak hier de beslissingen voor de huidige ronde.</p>
    
    <div class="cards-container">
        <div class="card">
            <div>
                <h2>Kamerprijs</h2>
                <p>Bepaal de gemiddelde prijs per kamer per nacht.</p>
            </div><br>
            <div>
                <label>Prijs per nacht (€)</label><br>
                <select>
                    <option value="40">40</option>
                    <option value="80">80</option>
                    <option value="120">120</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div>
                <h2>Marketing</h2>
                <p>Stel het marketingbudget in voor deze ronde.</p>
            </div><br>
            <div>
                <label>Marketingbudget (€)</label><br>
                <select>
                    <option value="5000">5000</option>
                    <option value="10000">10000</option>
                    <option value="15000">15000</option>
                    <option value="20000">20000</option>
                </select>
            </div>
        </div>
    </div>
</div>

</body>
</html>
